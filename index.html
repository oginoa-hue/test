<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性格診断テスト</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ピンク系の色に変更 */
            --primary-pink: #ff6b6b; /* タイトル、ボタンのピンク */
            --light-pink: #ffe0e0; /* タグ、背景の薄ピンク */
            --bg-color-start: #ffe0e0; /* 背景グラデーション開始 */
            --bg-color-end: #ffffff; /* 背景グラデーション終了 */
            --dot-color: #ffd1d1; /* ドットの色 */
            --card-shadow: 0 15px 30px rgba(0,0,0,0.06); /* カードの影を薄く */
            --text-color: #4a5568;
            --text-color-light: #718096;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* 背景のグラデーションとドットパターン */
            background: linear-gradient(135deg, var(--bg-color-start) 0%, var(--bg-color-end) 100%);
            background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--text-color);
        }

        .card {
            background: #ffffff;
            width: 90%;
            max-width: 440px;
            padding: 40px 20px;
            border-radius: 28px; /* 角をさらに丸く */
            box-shadow: var(--card-shadow);
            text-align: center;
            transition: transform 0.3s ease;
            box-sizing: border-box;
        }

        /* タイトルの色をピンクに */
        h1 {
            font-size: 1.5rem;
            color: var(--primary-pink);
            margin-bottom: 10px;
        }

        h2 {
            font-size: 0.8rem;
            color: var(--text-color-light);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        #question {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2d3748;
            line-height: 1.6;
            margin-bottom: 30px;
            min-height: 4rem;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        .btn:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* ピンク色の塗りつぶしボタン（「診断をはじめる」など） */
        .btn-primary {
            background: var(--primary-pink);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: #ff5252;
        }

        /* 診断中の選択肢ボタン（ピンク系） */
        .btn-check {
            border-color: #ffd1d1;
            color: var(--primary-pink);
        }

        .btn-check:hover {
            background: var(--light-pink);
            border-color: #ffb3b3;
        }

        /* タグ */
        .tags {
            margin-bottom: 30px;
        }

        .tag {
            display: inline-block;
            background: var(--light-pink);
            color: var(--primary-pink);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin: 0 4px;
        }

        /* プログレスバー */
        .progress-wrapper {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-color-light);
        }

        .progress-bar {
            width: 70%;
            height: 6px;
            background: #edf2f7;
            border-radius: 10px;
            overflow: hidden;
        }
        #bar {
            width: 0%;
            height: 100%;
            background: var(--primary-pink);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 各エリアの表示切り替え */
        #quiz-area, #result-area { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <div id="start-area">
            <h2>Personality Quiz</h2>
            <h1>性格診断テスト</h1>
            <div class="tags">
                <span class="tag">MBTI</span>
                <span class="tag">3択で直感</span>
                <span class="tag">スマホ向け</span>
            </div>
            <p style="color: var(--text-color-light); line-height: 1.6; margin-bottom: 40px;">
                あなたの心の傾向を、ざっくり言語化するためのセルフチェックです。深く考えすぎず、直感で答えてください。
            </p>
            <button class="btn btn-primary" onclick="startQuiz()">診断をはじめる</button>
        </div>

        <div id="quiz-area">
            <h2>Personality Quiz</h2>
            <p id="question">読み込み中...</p>
            
            <div class="btn-container">
                <button class="btn btn-check" onclick="answer(1)">あてはまる</button>
                <button class="btn" onclick="answer(0)">どちらでもない</button>
                <button class="btn btn-check" onclick="answer(-1)">あてはまらない</button>
            </div>

            <div class="progress-wrapper">
                <div class="progress-bar">
                    <div id="bar"></div>
                </div>
                <div id="progress-text">1 / 5</div>
            </div>
        </div>

        <div id="result-area">
            <h2>Your Type</h2>
            <div class="type-code" id="type" style="font-size: 3rem; font-weight: 900; color: var(--primary-pink); margin: 20px 0;"></div>
            <p id="description" style="color: var(--text-color-light); line-height: 1.6;">診断結果が出ました。これがあなたの心の傾向です。</p>
            <button class="btn" style="margin-top:30px; width:100%;" onclick="location.reload()">もう一度診断する</button>
        </div>
    </div>

    <script>
        const questions = [
            { text: "新しい場所やイベントに行くとワクワクする", trait: "E" },
            { text: "事実よりも、その裏にある意味や可能性を考えるのが好きだ", trait: "N" },
            { text: "決断を下すときは、感情よりも論理的な正しさを優先する", trait: "T" },
            { text: "計画はあらかじめ細かく決めておきたい", trait: "J" },
            { text: "期限ギリギリにならないとやる気が出ない", trait: "P" }
        ];

        let currentIdx = 0;
        let scores = { E:0, I:0, N:0, S:0, T:0, F:0, J:0, P:0 };

        function startQuiz() {
            document.getElementById("start-area").style.display = "none";
            document.getElementById("quiz-area").style.display = "block";
            updateQuiz();
        }

        function updateQuiz() {
            document.getElementById("question").innerText = questions[currentIdx].text;
            document.getElementById("bar").style.width = ((currentIdx + 1) / questions.length * 100) + "%";
            document.getElementById("progress-text").innerText = (currentIdx + 1) + " / " + questions.length;
        }

        function answer(val) {
            const q = questions[currentIdx];
            const opposite = { "E":"I", "N":"S", "T":"F", "J":"P", "P":"J" };
            
            if (val === 1) scores[q.trait]++;
            else if (val === -1) scores[opposite[q.trait]]++;

            currentIdx++;
            if (currentIdx < questions.length) {
                updateQuiz();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quiz-area").style.display = "none";
            document.getElementById("result-area").style.display = "block";

            let mbti = "";
            mbti += (scores.E >= scores.I) ? "E" : "I";
            mbti += (scores.N >= scores.S) ? "N" : "S";
            mbti += (scores.T >= scores.F) ? "T" : "F";
            mbti += (scores.J >= scores.P) ? "J" : "P";

            document.getElementById("type").innerText = mbti;
        }
    </script>
</body>
</html>
